services:
  database:
    image: postgres:15-alpine
    container_name: compose-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net

  backend:
    build: .
    container_name: compose-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database
    networks:
      - backend-net

volumes:
  pgdata:
    driver: local

networks:
  backend-net:
    driver: bridge
